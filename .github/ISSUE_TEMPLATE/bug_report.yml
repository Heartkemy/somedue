name: Bug report
description: Report a reproducible problem in Somedue.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, Cloud capabilities, or personal task data."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and Somedue version
    validations:
      required: true
